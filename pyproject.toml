[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfingest"
version = "0.1.0"
description = "Turn PDFs into Markdown, JSON and JSONL chunks, including the text inside embedded images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docling==2.135.0",
    "docling-core==2.101.0",
    "docling-parse==7.22.2",
    "pypdfium2==5.14.0",
    "ocrmac==1.0.1; sys_platform == 'darwin'",
    "wordfreq==3.1.1",
    "google-genai==2.31.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "fpdf2==2.8.9"]

[project.scripts]
pdfingest = "pdfingest:main"

[tool.setuptools]
py-modules = ["pdfingest"]
